<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/task.css">

</head>
<body >
    <script>
        let theme = localStorage.getItem("demy-tasks-theme");
        const body = document.querySelector("body");


        if (theme === "dark") {
            body.classList.add("dark-theme");
        } else if (theme === "light") {
            body.classList.remove("dark-theme");
        } else {
            if(window.matchMedia("(prefers-color-scheme: dark)").matches) {
                body.classList.add("dark-theme");
        
            } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
                body.classList.remove("dark-theme");
        
            }
            
        }
    </script>
    <div class="container">
        <header>
            <a class="logo" href="alltasks.html">All tasks</a>
            
            <button class="edit-task">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M80 0v-160h800V0H80Zm160-320h56l312-311-29-29-28-28-311 312v56Zm-80 80v-170l448-447q11-11 25.5-17t30.5-6q16 0 31 6t27 18l55 56q12 11 17.5 26t5.5 31q0 15-5.5 29.5T777-687L330-240H160Zm560-504-56-56 56 56ZM608-631l-29-29-28-28 57 57Z"/></svg>
                edit
            </button>
            <button class="delete-task">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
                delete
            </button>

        </header>

        <main>
            <section class="task-details">
                <h1 class="task-header"></h1>
                <p class="task-description">
                    
                </p>
                <p class="task-due">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M360-840v-80h240v80H360Zm80 440h80v-240h-80v240Zm40 320q-74 0-139.5-28.5T226-186q-49-49-77.5-114.5T120-440q0-74 28.5-139.5T226-694q49-49 114.5-77.5T480-800q62 0 119 20t107 58l56-56 56 56-56 56q38 50 58 107t20 119q0 74-28.5 139.5T734-186q-49 49-114.5 77.5T480-80Zm0-80q116 0 198-82t82-198q0-116-82-198t-198-82q-116 0-198 82t-82 198q0 116 82 198t198 82Zm0-280Z"/></svg>
                    <span class="task-due-date">22 jan 2025</span>
                </p>
                <span class="task-categorie-type" data-category-type="business"></span>

                <span class="task-priority">
                    <p>Priority</p>
                    <span class="task-priority-code" data-priority-type="high">
                        
                    </span>
                </span>
            </section>

            <section class="sub-task-section">
                <h3>
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M160-400v-80h280v80H160Zm0-160v-80h440v80H160Zm0-160v-80h440v80H160Zm360 560v-123l221-220q9-9 20-13t22-4q12 0 23 4.5t20 13.5l37 37q8 9 12.5 20t4.5 22q0 11-4 22.5T863-380L643-160H520Zm300-263-37-37 37 37ZM580-220h38l121-122-18-19-19-18-122 121v38Zm141-141-19-18 37 37-18-19Z"/></svg>
                    Sub-task
                </h3>
                <div class="progress-section">
                    <div class="progress-bar" data-progressBarWidth="20px"></div>
                    <span class="progress-text"></span>
                </div>

                <div class="sub-tasks">
                    
                </div>
                <div class="input-new-task">
                    <button class="close-subtask-modal">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                    </button>
                    <label for="new-subtask-input">New Sub-task:</label>
                    <input type="text" id="new-subtask-input">
                    <button class="add-subtask">Add</button>
                </div>
                <button class="add-sub-task">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>
                    Add Sub-task
                </button>
            </section>

            <section class="attachment-section">
                <h2>attachment</h2>
                <div class="file-cont">
                    <!-- content will be added here -->
                </div>
            </section>


        </main>
    </div>

    <!-- <script src="src/header.js"></script> -->
    <script type="module" src="src/task.js"></script>
</body>
</html>
