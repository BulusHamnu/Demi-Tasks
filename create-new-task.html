<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New task | Demi-Tasks</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/vanilla-calendar-pro/styles/index.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vanilla-calendar-pro/index.js" defer></script>

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/create-new-task.css">
</head>
<body >
    <script>
        let theme = localStorage.getItem("demy-tasks-theme");
        const body = document.querySelector("body");


        if (theme === "dark") {
            body.classList.add("dark-theme");
        } else if (theme === "light") {
            body.classList.remove("dark-theme");
        } else {
            if(window.matchMedia("(prefers-color-scheme: dark)").matches) {
                body.classList.add("dark-theme");
        
            } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
                body.classList.remove("dark-theme");
        
            }
            
        }
    </script>
    <div class="container">
        <header>
            <a class="logo" href="alltasks.html">Back to Tasks</a>
            <div class="theme-switch">
                <svg class="light-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M480-360q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Zm0 80q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Zm326-268Z"/></svg>

                <svg class="dark-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"/></svg>
            </div>
        </header>

        <main >
            <h1>Create new task</h1>
            <section class="about-task">
                <div class="tittle">
                    <label for="task-title">title</label>
                    <input type="text" id="task-title" placeholder="complete portfolio design">
                </div>
                <div class="description">
                    <label for="task-description">description</label>
                    <textarea id="task-description" placeholder="Work on landing page and design"></textarea>
                </div>
                <div class="task-piyority">
                    <label for="task-piority">priority</label>
                    <div class="piyorities">
                        <label for="high-piyority">
                            <input type="radio" id="high-piyority" name="task-piority" value="high" class="task-piyority-selector">
                            🔥 High
                        </label>
                        <label for="medium-piyority">
                            <input type="radio" id="medium-piyority" name="task-piority" value="medium" class="task-piyority-selector">
                            🟡 medium
                        </label>
                        <label for="low-piyority">
                            <input type="radio" id="low-piyority" name="task-piority" value="low" class="task-piyority-selector">
                            🟢 low
                        </label>
                    </div>

                </div>
            </section>
            
            <section class="task-date-section">
                <div class="date-selector">
                    <div class="date">
                        <label for="task-date">Due date</label>
                        <input type="date" id="task-due-date">
                    </div>

                    <div class="add-reminder">
                        <label for="add-reminder">Add reminder</label>
                        
                        <label for="yes">
                            <input type="radio" name="reminder" id="yes" value="yes">
                            yes
                        </label>

                        <label for="no">
                            <input type="radio" name="reminder" id="no" value="no" checked>
                            no
                        </label>

                    </div>
                </div>

                <div class="reminder-selector">
                    <div>
                        <label for="reminder-selector">date and time</label>

                    <select name="reminder-type" id="reminder-type">
                        <option value="daily">daily</option>
                        <option value="weekly">weekly</option>
                        <option value="monthly">monthly</option>
                        <option value="yearly">yearly</option>
                    </select>
                    </div>

                    <div id="reminder-calander-cont">
                        <input type="date" id="reminder-calander" placeholder="Pick a date">

                        <input type="time" name="reminder-time" id="reminder-time">

                    </div>
                    
                </div>

            </section>

            <section class="task-categories">
                <h2>categories</h2>
                <div class="categories">
                    <label for="business">
                        <input type="radio" id="business" name="categories" value="business" class="category-selector">
                        💼 business
                    </label>
                    <label for="personal">
                        <input type="radio" id="personal" name="categories" value="personal" class="category-selector">
                        👤 personal
                    </label>
                    <label for="projects">
                        <input type="radio" id="projects" name="categories" value="projects" class="category-selector">
                        🗂️ projects
                    </label>
                    <label for="fitness">
                        <input type="radio" id="fitness" name="categories" value="fitness" class="category-selector">
                        🏋 fitness
                    </label>
                    <label for="research">
                        <input type="radio" id="research" name="categories" value="research" class="category-selector">
                        🔍 research
                    </label>
                    <label for="hobbies">
                        <input type="radio" id="hobbies" name="categories" value="hobbies" class="category-selector">
                        🎨 hobbies
                    </label>
                    <label for="maintenance">
                        <input type="radio" id="maintenance" name="categories" value="maintenance" class="category-selector">
                        🛠️maintenance 
                    </label>

                    <label for="other">
                        <input type="radio" id="other" name="categories" value="other" class="category-selector">
                        add custom
                    </label>
                    
                </div>
                
                <div class="custom-category">
                    <input type="text" id="custom-category-input" placeholder="add new category">
                    <button id="add-custom-category">Add</button>
                </div>
            </section>
            
            <section class="sub-tasks">
                <h2>sub-tasks</h2>
                
                <div class="sub-tasks-list">
                    <!-- Subtask will be added here -->
                </div>

                <div class="add-sub-task">
                    <input type="text" id="sub-task-description" placeholder="Complete wireframes">
                    <button class="add-sub-task-btn">Add</button>
                </div>
            
            </section>

            <section class="attachment-section">
                <h2>Attach files</h2>
                <p>note: not more than 5mb of size</p>

                <div class="attachments">
                    <!-- Attachment files will be added here -->
                </div>
                
                <div class="add-attachment-selector">
                    <input type="file" id="attachment-file" accept=".pdf,.jpg,.png,.jpeg,.docx,.xlsx,.pptx,.txt,.zip,.rar,.7z">
                    <button id="upload-attachment">Upload</button>
                </div>

            </section>

            <div class="task-actions">
                <button id="cancel-task-btn">Cancel</button>
                <button id="save-task-btn">Save</button>
            </div>
        </main>
    </div>

    <script src="src/header.js"></script>
    <script type="module" src="src/create-new-task.js"></script>
</body>
</html>
