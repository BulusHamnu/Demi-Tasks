<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Demi-Task</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/vanilla-calendar-pro/styles/index.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vanilla-calendar-pro/index.js" defer></script>
    
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body >\
    <script>
        let theme = localStorage.getItem("demy-tasks-theme");
        const body = document.querySelector("body");


        if (theme === "dark") {
            body.classList.add("dark-theme");
        } else if (theme === "light") {
            body.classList.remove("dark-theme");
        } else {
            if(window.matchMedia("(prefers-color-scheme: dark)").matches) {
                body.classList.add("dark-theme");
        
            } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
                body.classList.remove("dark-theme");
        
            }
            
        }
    </script>
    <div class="container">
        <header>
            <a class="logo" href="/index.html">Demi-Tasks</a>
            <div class="notification">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M160-200v-80h80v-280q0-83 50-147.5T420-792v-28q0-25 17.5-42.5T480-880q25 0 42.5 17.5T540-820v28q80 20 130 84.5T720-560v280h80v80H160Zm320-300Zm0 420q-33 0-56.5-23.5T400-160h160q0 33-23.5 56.5T480-80ZM320-280h320v-280q0-66-47-113t-113-47q-66 0-113 47t-47 113v280Z"/></svg>
            </div>
            <!-- Theme switch -->
            <div class="theme-switch">
                <svg class="light-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M480-360q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Zm0 80q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Zm326-268Z"/></svg>

                <svg class="dark-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"/></svg>
            </div>
        </header>

        <main class="daskboard-main">

            <!-- Task overview section -->
            <section class="taskoverview">
                <div class="headline">
                    <select name="period-selector" id="period-selector" class="period-seclector">
                        <option value="Today">Today</option>
                        <option value="This Week">This Week</option>
                        <option value="This Month">This Month</option>
                    </select>

                    <h2>Task Overview</h2>
                    <button class="view-task" onclick="window.location.href=`alltasks.html`">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/></svg>
                        View all task
                    </button>
                </div>

                <div class="task-details">
                    <div class="In progress detail-card">
                        <div id="outter">
                            <svg class="inprogress-bar" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="50" cy="50" r="35"    
                                  />
                            </svg>
                            <div class="inner"><p class="number">5/10</p></div>
                        </div>

                        <p>🔄 In progress</p>
                    </div> 

                    <div class="completed detail-card">
                        <div id="outter">
                            <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="50" cy="50" r="35"    
                                  />
                            </svg>
                            <div class="inner"><p class="number">5/10</p></div>
                        </div>

                        <p>✅ completed</p>
                    </div>

                    <div class="over-due detail-card">
                        <div id="outter">
                            <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="50" cy="50" r="35"    
                                  />
                            </svg>
                            <div class="inner"><p class="number">5/10</p></div>
                        </div>

                        <p>⏰ Over due</p>
                    </div>

                    <div class="in-completed detail-card">
                        <div id="outter">
                            <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="50" cy="50" r="35"    
                                  />
                            </svg>
                            <div class="inner"><p class="number">5/10</p></div>
                        </div>

                        <p></i>🔲 In complete</p>
                    </div>
                </div>
            </section>
            <section class="taskanalysis">
                <h2>Task Analysis</h2>
                <div class="chart-container" style="position: relative;">
                    <canvas id="task-chart"></canvas>
                </div>

                <div class="highlight">
                    <ul>
                        <li><span class="first"></span><p>in progess</p></li>
                        <li><span class="second"></span><p>Completed</p></li>
                        <li><span class="third"></span><p>Over due</p></li>
                        <li><span class="four"></span><p>In complete</p></li>
                    </ul>
                </div>
            </section>
            <section class="calander">
                <h2>Calander</h2>

                <div id="calendar"></div>
            </section>
        </main>
    </div>

    <script src="src/header.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="src/index.js"></script>
</body>
</html>
